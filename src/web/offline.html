<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>kanban is offline</title>
		<style>
			:root {
				color-scheme: light dark;
				--page: #f7f6f3;
				--ink: #1d1c1a;
				--muted: #6f6b64;
				--accent: #b5502f;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--page: #141413;
					--ink: #ecebe8;
					--muted: #a19d95;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
				background: var(--page);
				color: var(--ink);
				font: 16px/1.5 system-ui, -apple-system, sans-serif;
				text-align: center;
			}
			img {
				width: 96px;
				height: 96px;
				border-radius: 22px;
			}
			p {
				max-width: 340px;
				color: var(--muted);
			}
			button {
				min-height: 44px;
				padding: 0 20px;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: #fff;
				font: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="icon-192.png" alt="" />
			<h1>The board can't be reached</h1>
			<p>The Mac running it may be asleep, or this device may be off the network that reaches it.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
